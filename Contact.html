/* --- BASIC CALENDAR STYLES --- */
.calendar-container {
    max-width: 900px;
    margin: 20px auto;
    padding: 20px;
}

.calendar-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.calendar-controls button {
    width: 120px;
    height: 45px;
    font-size: 15px;
}

.calendar-controls button:hover {
    width: 125px;
    height: 48px;
}

.month-label {
    font-size: 24px;
    font-weight: bold;
    color: rgb(99, 30, 8);
    margin: 0;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border: 3px solid rgb(99, 30, 8);
    background-color: rgb(99, 30, 8);
    gap: 3px;
}

.day-header {
    background-color: rgb(99, 30, 8);
    color: white;
    font-weight: bold;
    text-align: center;
    padding: 10px 0;
}

.calendar-day {
    background-color: white;
    min-height: 90px;
    padding: 8px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}

.calendar-day.empty {
    background-color: rgb(255, 255, 255);
}

.date-number {
    font-weight: bold;
    color: rgb(99, 30, 8);
    margin-bottom: 6px;
}

.event-text {
    font-size: 12px;
    color: #333;
    background-color: #f0f0f0;
    border-left: 3px solid rgb(99, 30, 8);
    padding: 3px 5px;
    margin-top: 2px;

<h1 class="center">Important Dates</h1>
<hr>
<br>

<div class="calender">
    <div class="calendar-container">
        <div class="calendar-controls">
            <button onclick="changeMonth(-1)">Previous</button>
            <h2 id="monthDisplay" class="month-label"></h2>
            <button onclick="changeMonth(1)">Next</button>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <!-- Headers and days will be generated by JS -->
        </div>
    </div>
</div>

<script>
// --- EDIT YOUR EVENTS IN CODE HERE ---
// Format: "YYYY-MM-DD": "Event Description"
const clubEvents = {
    "2026-10-14": "Club Meeting[2:37-3:30]",
    "2026-10-28": "Club Meeting[2:37-3:30]",
};

let currentDate = new Date();

const monthNames = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
];

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthDisplay").innerText = monthNames[month] + " " + year;

    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    daysOfWeek.forEach(day => {
        const header = document.createElement("div");
        header.className = "day-header";
        header.innerText = day;
        grid.appendChild(header);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "calendar-day empty";
        grid.appendChild(emptyCell);
    }

    for (let day = 1; day <= totalDays; day++) {
        const dayCell = document.createElement("div");
        dayCell.className = "calendar-day";

        const dateNum = document.createElement("div");
        dateNum.className = "date-number";
        dateNum.innerText = day;
        dayCell.appendChild(dateNum);

        const monthStr = String(month + 1).padStart(2, '0');
        const dayStr = String(day).padStart(2, '0');
        const dateKey = `${year}-${monthStr}-${dayStr}`;

        if (clubEvents[dateKey]) {
            const eventDiv = document.createElement("div");
            eventDiv.className = "event-text";
            eventDiv.innerText = clubEvents[dateKey];
            dayCell.appendChild(eventDiv);
        }

        grid.appendChild(dayCell);
    }
}

function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
}

renderCalendar();
</script>
