name: Trigger server update

on:
  push:
    branches:
      - main

permissions:
  id-token: write

jobs:
  update:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Request OIDC token and trigger update
        env:
          OIDC_AUDIENCE: https://deploy.example.com
          ENDPOINT: https://deploy.example.com/app/update
        run: |
          set -euo pipefail

          oidc_token=$(curl --fail --silent --show-error \
            --get \
            --data-urlencode "audience=${OIDC_AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
            | jq -er '.value')

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${oidc_token}" \
            "${ENDPOINT}"
